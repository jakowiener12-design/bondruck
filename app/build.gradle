plugins {
    id 'com.android.application'
}

android {
    namespace 'at.cardano.bondruck'
    compileSdk 34

    defaultConfig {
        applicationId 'at.cardano.bondruck'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName "1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        fixed {
            storeFile file('bondruck.jks')
            storePassword 'bondruck'
            keyAlias 'bondruck'
            keyPassword 'bondruck'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Texterkennung auf dem Gerät (ohne Internet), lateinische Schrift inkl. Umlaute
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
